<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lutqhysky · 导航主页</title>
  <style>
    :root {
      --bg: #eceef2;
      --card: #ffffff;
      --text: #2e2f35;
      --muted: #6d717c;
      --line: rgba(32, 37, 49, 0.08);
      --blue: #2f80ed;
      --orange: #ff9f1a;
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --shadow: 0 10px 24px rgba(18, 24, 33, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(175, 184, 200, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(175, 184, 200, 0.22) 1px, transparent 1px),
        var(--bg);
      background-size: 44px 44px, 44px 44px, auto;
      min-height: 100vh;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 34px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.38), transparent 44%),
        linear-gradient(135deg, #5d9460, #87b984 40%, #6ea67a);
      min-height: 206px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      text-align: center;
      font-size: clamp(28px, 6vw, 40px);
      letter-spacing: -0.8px;
      line-height: 1.1;
      text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .search-shell {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 6px;
      display: flex;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
    }

    .search-form {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      padding: 0 10px;
    }

    .search-icon {
      font-size: 18px;
      color: #7b818f;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      height: 42px;
      background: transparent;
      font-size: 17px;
      color: #30333b;
    }

    .search-btn {
      border: none;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 18px;
    }

    .tool {
      color: #3f4450;
      font-size: 26px;
      line-height: 1;
    }

    .switch {
      width: fit-content;
      margin: 14px auto 2px;
      background: rgba(48, 53, 64, 0.35);
      border-radius: 999px;
      padding: 4px;
      display: flex;
      gap: 4px;
      backdrop-filter: blur(4px);
    }

    .pill {
      height: 38px;
      min-width: 170px;
      border-radius: 999px;
      border: none;
      padding: 0 16px;
      background: transparent;
      color: #f2f4f8;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill.active {
      background: #fff;
      color: var(--blue);
    }

    .section {
      margin-top: 24px;
    }

    .section-title {
      margin: 0 0 14px;
      color: #a7b0bf;
      font-size: 49px;
      font-weight: 800;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span {
      color: #5f636c;
      font-size: 42px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: 0 6px 14px rgba(22, 28, 41, 0.05);
      min-height: 168px;
      transition: 0.18s ease;
    }

    .card:hover { transform: translateY(-2px); }

    .heat {
      position: absolute;
      top: 12px;
      right: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff1dc;
      color: var(--orange);
      border-radius: 10px;
      padding: 3px 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #f3f5fb;
      border: 1px solid rgba(66, 75, 92, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.4px;
      line-height: 1.2;
      color: #2f3137;
    }

    .card p {
      margin: 8px 0 0;
      font-size: 16px;
      color: #666b76;
      line-height: 1.5;
    }

    .float-tools {
      position: fixed;
      right: 16px;
      bottom: 80px;
      display: grid;
      gap: 10px;
      z-index: 30;
    }

    .float-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.95);
      box-shadow: var(--shadow);
      font-size: 26px;
      color: #5f6470;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (max-width: 680px) {
      .section-title { font-size: 44px; }
      .section-title span { font-size: 38px; }
      .card h3 { font-size: 22px; }
      .card p { font-size: 15px; }
    }

    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .pill { min-width: 140px; }
      .search-btn { padding: 0 13px; }
      .hero { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>ddgksf2013 导航站</h1>

      <div class="search-shell">
        <form class="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noreferrer">
          <span class="search-icon">🔍</span>
          <input class="search-input" type="text" name="q" placeholder="搜索内容..." required />
          <button class="search-btn" type="submit">Google</button>
        </form>
      </div>

      <div class="toolbar">
        <span class="tool">🌐</span>
        <span class="tool">☰</span>
      </div>

      <div class="switch" aria-label="tab switch">
        <button class="pill active" type="button">🌍 WebIndex</button>
        <button class="pill" type="button">☀ QuantumultX</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title"># <span>资源推荐</span></h2>
      <div class="cards">
        <a class="card" href="https://dash.cloudflare.com/" target="_blank" rel="noreferrer">
          <span class="heat">🔥 10970</span>
          <div class="logo">⚡</div>
          <h3>Cloudflare 控制台</h3>
          <p>管理域名、Pages 与边缘网络规则。</p>
        </a>

        <a class="card" href="https://n8n.lutqhysky.qzz.io/" target="_blank" rel="noreferrer">
          <span class="heat">🔥 8691</span>
          <div class="logo">🤖</div>
          <h3>n8n 自动化</h3>
          <p>流程编排、消息通知与脚本任务入口。</p>
        </a>

        <a class="card" href="https://github.com/lutqhysky/lutqhysky-homepage" target="_blank" rel="noreferrer">
          <span class="heat">🔥 9442</span>
          <div class="logo">🐙</div>
          <h3>GitHub 仓库</h3>
          <p>主页源码托管，修改后自动触发部署。</p>
        </a>

        <a class="card" href="https://lutqhysky.qzz.io/" target="_blank" rel="noreferrer">
          <span class="heat">🔥 7664</span>
          <div class="logo">🌐</div>
          <h3>主域名入口</h3>
          <p>汇总你的个人站点与所有服务地址。</p>
        </a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title"># <span>效率工具</span></h2>
      <div class="cards">
        <a class="card" href="https://calendar.google.com/" target="_blank" rel="noreferrer">
          <span class="heat">🔥 30256</span>
          <div class="logo">📅</div>
          <h3>Google Calendar</h3>
          <p>日程安排、提醒和周期任务管理。</p>
        </a>

        <a class="card" href="https://mail.google.com/" target="_blank" rel="noreferrer">
          <span class="heat">🔥 5063</span>
          <div class="logo">✉️</div>
          <h3>Gmail</h3>
          <p>邮件收发和通知汇总的核心入口。</p>
        </a>
      </div>
    </section>
  </main>

  <div class="float-tools" aria-hidden="true">
    <button class="float-btn" type="button" title="最近">🕘</button>
    <button class="float-btn" type="button" title="夜间">☾</button>
    <button class="float-btn" type="button" title="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  </div>
</body>
</html>
