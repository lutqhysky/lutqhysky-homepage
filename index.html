<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lutqhysky · 导航站</title>
  <style>
    :root {
      --bg: #eceef2;
      --grid: rgba(128, 140, 160, 0.18);
      --card: #ffffff;
      --text: #2d313a;
      --muted: #6f7582;
      --line: rgba(31, 39, 56, 0.08);
      --brand: #2f80ed;
      --hot: #f8a62b;
      --hot-bg: #fff1dc;
      --hero-1: #6b9f6f;
      --hero-2: #90bf8c;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --shadow: 0 10px 22px rgba(15, 24, 38, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: 42px 42px, 42px 42px, auto;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px;
    }

    .hero {
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,0.28), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2), transparent 40%),
        linear-gradient(135deg, var(--hero-1), var(--hero-2));
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .site-title {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(26px, 4vw, 44px);
      color: rgba(255,255,255,0.92);
      letter-spacing: -0.8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .search-wrap {
      background: rgba(255,255,255,0.92);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      padding: 6px;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }

    .search-form span {
      font-size: 18px;
      color: #7b8190;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      height: 42px;
      background: transparent;
      font-size: 17px;
      color: #2f3441;
    }

    .search-btn {
      border: none;
      border-radius: 999px;
      height: 38px;
      padding: 0 16px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .hero-toolbar {
      margin-top: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.94);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 30px;
      color: #404654;
      line-height: 1;
    }

    .switch {
      margin: 12px auto 0;
      width: fit-content;
      display: flex;
      gap: 4px;
      border-radius: 999px;
      background: rgba(45, 52, 64, 0.35);
      padding: 4px;
    }

    .switch button {
      border: none;
      border-radius: 999px;
      min-width: 170px;
      height: 38px;
      font-size: 17px;
      font-weight: 600;
      padding: 0 15px;
      background: transparent;
      color: #f1f3f6;
      cursor: pointer;
    }

    .switch .active {
      background: #fff;
      color: var(--brand);
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #a8b1bf;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span {
      color: #5b606b;
      font-size: 0.84em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      border-radius: var(--radius-lg);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 6px 16px rgba(18, 26, 39, 0.06);
      padding: 18px;
      min-height: 170px;
      display: block;
      color: inherit;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .card:hover { transform: translateY(-2px); }

    .hot {
      position: absolute;
      top: 12px;
      right: 12px;
      border-radius: 10px;
      background: var(--hot-bg);
      color: var(--hot);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 9px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid rgba(67, 77, 98, 0.1);
      background: #f3f5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0;
      font-size: clamp(23px, 2.6vw, 38px);
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.52;
    }

    .float-tools {
      position: fixed;
      right: 16px;
      bottom: 76px;
      display: grid;
      gap: 10px;
      z-index: 20;
    }

    .float-tools button {
      width: 58px;
      height: 58px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      box-shadow: var(--shadow);
      font-size: 25px;
      color: #5d6370;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .switch button { min-width: 145px; font-size: 15px; }
      .card p { font-size: 15px; }
    }

    @media (max-width: 600px) {
      .page { padding: 10px; }
      .cards { grid-template-columns: 1fr; }
      .hero { padding: 14px; }
      .hero-toolbar { font-size: 26px; }
      .search-btn { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1 class="site-title">ddgksf2013 导航站</h1>

      <div class="search-wrap">
        <form class="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noreferrer">
          <span>🔍</span>
          <input class="search-input" type="text" name="q" placeholder="搜索内容..." required />
          <button class="search-btn" type="submit">Google</button>
        </form>
      </div>

      <div class="hero-toolbar" aria-hidden="true">
        <span>🌐</span>
        <span>☰</span>
      </div>

      <div class="switch" aria-hidden="true">
        <button class="active" type="button">🌍 WebIndex</button>
        <button type="button">☀ QuantumultX</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title"># <span>推广</span></h2>
      <div class="cards">
        <a class="card" href="https://dash.cloudflare.com/" target="_blank" rel="noreferrer">
          <span class="hot">🔥 10970</span>
          <div class="logo">⚡</div>
          <h3>Cloudflare 控制台</h3>
          <p>域名、Pages、Workers 与规则统一管理。</p>
        </a>

        <a class="card" href="https://n8n.lutqhysky.qzz.io/" target="_blank" rel="noreferrer">
          <span class="hot">🔥 8691</span>
          <div class="logo">🤖</div>
          <h3>n8n 自动化</h3>
          <p>抓取、通知和任务流的集中操作入口。</p>
        </a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title"># <span>资源推荐</span></h2>
      <div class="cards">
        <a class="card" href="https://github.com/lutqhysky/lutqhysky-homepage" target="_blank" rel="noreferrer">
          <span class="hot">🔥 9442</span>
          <div class="logo">🐙</div>
          <h3>GitHub 仓库</h3>
          <p>源码维护与版本管理，自动触发部署。</p>
        </a>

        <a class="card" href="https://lutqhysky.qzz.io/" target="_blank" rel="noreferrer">
          <span class="hot">🔥 7664</span>
          <div class="logo">🌐</div>
          <h3>主域名入口</h3>
          <p>汇总主页、子站和日常服务访问链接。</p>
        </a>

        <a class="card" href="https://calendar.google.com/" target="_blank" rel="noreferrer">
          <span class="hot">🔥 30256</span>
          <div class="logo">📅</div>
          <h3>Google Calendar</h3>
          <p>任务计划、会议安排和提醒管理。</p>
        </a>

        <a class="card" href="https://mail.google.com/" target="_blank" rel="noreferrer">
          <span class="hot">🔥 5063</span>
          <div class="logo">✉️</div>
          <h3>Gmail</h3>
          <p>邮件收发、系统通知与账号消息汇总。</p>
        </a>
      </div>
    </section>
  </main>

  <div class="float-tools" aria-hidden="true">
    <button type="button" title="最近">🕘</button>
    <button type="button" title="夜间">☾</button>
    <button type="button" title="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  </div>
</body>
</html>
